name: Build iOS IPA
on: [workflow_dispatch]
jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Xcode version
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: 'latest-stable'

      - name: Install Dependencies
        run: |
          if [ -f "yarn.lock" ]; then yarn install; elif [ -f "package.json" ]; then npm install; fi

      - name: Install CocoaPods
        run: |
          cd ios && pod install || echo "No Podfile found or step skipped"
          cd ..

      - name: Build and Package Archive
        run: |
          mkdir -p build/Payload
          XCODE_PROJECT=$(find ios -name "*.xcodeproj" -maxdepth 2 | head -n 1)
          XCODE_WORKSPACE=$(find ios -name "*.xcworkspace" -maxdepth 2 | head -n 1)
          if [ -n "$XCODE_WORKSPACE" ]; then
            echo "Building workspace: $XCODE_WORKSPACE"
            xcodebuild archive -workspace "$XCODE_WORKSPACE" -scheme LLMHub -archivePath build/LLMHub.xcarchive -destination "generic/platform=iOS" CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO
          else
            echo "Building project: $XCODE_PROJECT"
            xcodebuild archive -project "$XCODE_PROJECT" -scheme LLMHub -archivePath build/LLMHub.xcarchive -destination "generic/platform=iOS" CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO
          fi
          cp -r build/LLMHub.xcarchive/Products/Applications/*.app build/Payload/
          cd build && zip -r LLMHub.ipa Payload/

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LLMHub-unsigned-ipa
          path: build/LLMHub.ipa
