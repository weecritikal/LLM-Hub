name: Build iOS IPA
on: [workflow_dispatch]

jobs:
  build:
    runs-on: macos-26
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select latest stable Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Build and package unsigned IPA
        run: |
          set -eo pipefail
          mkdir -p build/Payload

          PROJECT=ios/LLMHub/LLMHub.xcodeproj

          xcodebuild -resolvePackageDependencies \
            -project "$PROJECT" -scheme LLMHub

          xcodebuild archive \
            -project "$PROJECT" \
            -scheme LLMHub \
            -archivePath build/LLMHub.xcarchive \
            -destination "generic/platform=iOS" \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

          cp -R build/LLMHub.xcarchive/Products/Applications/*.app build/Payload/
          cd build
          zip -qr LLMHub.ipa Payload

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: LLMHub-unsigned-ipa
          path: build/LLMHub.ipa
