name: Build iOS IPA
on: [workflow_dispatch]

jobs:
  build:
    runs-on: macos-26
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fetch local packages the repo points to
        run: |
          set -eo pipefail
          echo "Folders the repo expects to be separate git repos:"
          git ls-files -s | awk '$1=="160000"{print $2" "$4}' | tee /tmp/gitlinks.txt

          while read -r SHA DIR; do
            NAME=$(basename "$DIR")
            case "$NAME" in
              draw-things-community) URL=https://github.com/drawthingsai/draw-things-community.git ;;
              media-generation-kit)  URL=https://github.com/drawthingsai/media-generation-kit.git ;;
              *) echo "::warning::No known source for $DIR, skipping"; continue ;;
            esac

            echo "Fetching $NAME at $SHA"
            rm -rf "$DIR"
            mkdir -p "$DIR"
            git -C "$DIR" init -q
            git -C "$DIR" remote add origin "$URL"
            if git -C "$DIR" fetch --depth 1 origin "$SHA"; then
              git -C "$DIR" checkout -q FETCH_HEAD
            else
              echo "::warning::Pinned commit not available for $NAME, using latest"
              git -C "$DIR" fetch --depth 1 origin HEAD
              git -C "$DIR" checkout -q FETCH_HEAD
            fi
          done < /tmp/gitlinks.txt

          PKG=ios/LLMHub/LocalPackages/media-generation-kit
          if [ ! -f "$PKG/Package.swift" ]; then
            echo "media-generation-kit missing, downloading latest public copy"
            rm -rf "$PKG"
            mkdir -p ios/LLMHub/LocalPackages
            git clone --depth 1 https://github.com/drawthingsai/media-generation-kit.git "$PKG"
          fi

          DTC=ios/LLMHub/LocalPackages/draw-things-community
          if [ ! -f "$DTC/Package.swift" ]; then
            echo "draw-things-community missing, downloading latest public copy"
            rm -rf "$DTC"
            git clone --depth 1 https://github.com/drawthingsai/draw-things-community.git "$DTC"
          fi

          echo "LocalPackages contents:"
          ls -la ios/LLMHub/LocalPackages
          test -f "$PKG/Package.swift"
          test -f "$DTC/Package.swift"

      - name: Patch packages (fix duplicate ZIPFoundation)
        run: |
          set -eo pipefail
          python3 - <<'PY'
          import re, pathlib

          root = pathlib.Path("ios/LLMHub/LocalPackages")
          dtc = root / "draw-things-community"
          mgk = root / "media-generation-kit"

          # 1. Rename Draw Things' built-in ZIPFoundation target
          pkg = dtc / "Package.swift"
          s = pkg.read_text()
          n = s.count('"ZIPFoundation"')
          pkg.write_text(s.replace('"ZIPFoundation"', '"DTZIPFoundation"'))
          print("Package.swift: renamed", n, "ZIPFoundation references")

          changed = 0
          for sub in ("Libraries", "Apps"):
              base = dtc / sub
              if not base.exists():
                  continue
              for f in base.rglob("*.swift"):
                  try:
                      t = f.read_text()
                  except Exception:
                      continue
                  t2 = re.sub(r"\bimport ZIPFoundation\b", "import DTZIPFoundation", t)
                  if t2 != t:
                      f.write_text(t2)
                      changed += 1
          print("Updated imports in", changed, "source files")

          # 2. Point media-generation-kit at the local draw-things-community
          mp = mgk / "Package.swift"
          m = mp.read_text()
          m2, k = re.subn(
              r'\.package\(\s*url:\s*"https://github\.com/drawthingsai/draw-things-community(?:\.git)?"[^)]*\)',
              '.package(path: "../draw-things-community")',
              m, flags=re.S)
          mp.write_text(m2)
          print("media-generation-kit: replaced", k, "draw-things-community dependency")
          PY

          echo "---- media-generation-kit Package.swift ----"
          cat ios/LLMHub/LocalPackages/media-generation-kit/Package.swift

      - name: Create Secrets xcconfig files
        run: |
          set -eo pipefail
          cd ios/LLMHub
          # These files are gitignored, so they are never in the checkout.
          # The repo ships .template copies; build from those.
          for cfg in debug release; do
            if [ -f "Secrets.$cfg.xcconfig.template" ]; then
              cp "Secrets.$cfg.xcconfig.template" "Secrets.$cfg.xcconfig"
            else
              printf 'BYPASS_PREMIUM_UNLOCK = NO\nHF_TOKEN =\n' > "Secrets.$cfg.xcconfig"
            fi
          done
          # Release builds must never bypass the premium unlock
          grep -q '^BYPASS_PREMIUM_UNLOCK *= *NO' Secrets.release.xcconfig
          ls -la Secrets.*.xcconfig
          echo "---- Secrets.release.xcconfig ----"
          cat Secrets.release.xcconfig

      - name: Select latest stable Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Install certificate and profile
        env:
          CERT_B64: ${{ secrets.DEV_CERT_P12_BASE64 }}
          CERT_PASS: ${{ secrets.DEV_CERT_PASSWORD }}
          PROFILE_B64: ${{ secrets.PROVISION_PROFILE_BASE64 }}
        run: |
          set -eo pipefail
          KEYCHAIN="$RUNNER_TEMP/build.keychain-db"
          KEYCHAIN_PASS="$(uuidgen)"

          echo "$CERT_B64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          echo "$PROFILE_B64" | base64 --decode > "$RUNNER_TEMP/profile.mobileprovision"

          security create-keychain -p "$KEYCHAIN_PASS" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASS" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -P "$CERT_PASS" \
            -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: \
            -k "$KEYCHAIN_PASS" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" login.keychain-db

          PROFILE_UUID=$(security cms -D -i "$RUNNER_TEMP/profile.mobileprovision" \
            | plutil -extract UUID raw -)
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$RUNNER_TEMP/profile.mobileprovision" \
            "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision"

          # Decoded copies used by the checks and the signing step
          security cms -D -i "$RUNNER_TEMP/profile.mobileprovision" > "$RUNNER_TEMP/profile.plist"
          security find-identity -v -p codesigning "$KEYCHAIN" \
            | awk '/^ *[0-9]+\)/ {print $2}' > "$RUNNER_TEMP/identities.txt"
          security find-certificate -a -p "$KEYCHAIN" > "$RUNNER_TEMP/keychain_certs.pem" || true
          echo "Signing identities imported: $(wc -l < "$RUNNER_TEMP/identities.txt" | tr -d ' ')"
          test -s "$RUNNER_TEMP/identities.txt"

      - name: Check certificate matches profile
        run: |
          set -eo pipefail
          python3 - <<'PY'
          import datetime, hashlib, os, plistlib, sys

          tmp = os.environ["RUNNER_TEMP"]
          prof = plistlib.load(open(f"{tmp}/profile.plist", "rb"))

          print("Profile name:   ", prof.get("Name"))
          print("Team:           ", prof.get("TeamIdentifier"))
          print("App ID:         ", prof.get("Entitlements", {}).get("application-identifier"))
          print("Devices in profile:", len(prof.get("ProvisionedDevices", [])))

          now = datetime.datetime.now(datetime.timezone.utc).replace(tzinfo=None)
          exp = prof.get("ExpirationDate")
          if exp and exp < now:
              print(f"::error::The provisioning profile expired on {exp} UTC. Regenerate it and update the PROVISION_PROFILE_BASE64 secret.")
              sys.exit(1)

          profile_certs = {hashlib.sha1(c).hexdigest().upper() for c in prof.get("DeveloperCertificates", [])}
          identities = [l.strip().upper() for l in open(f"{tmp}/identities.txt") if l.strip()]
          print("Certificates in profile:", sorted(profile_certs))
          print("Certificates imported:  ", identities)

          # Human-readable view of both sides, so a mismatch is easy to diagnose
          import re, ssl, subprocess

          def describe(der):
              try:
                  r = subprocess.run(
                      ["openssl", "x509", "-inform", "DER", "-noout", "-subject", "-enddate"],
                      input=der, capture_output=True, timeout=20)
                  return " ; ".join(l.strip() for l in r.stdout.decode(errors="replace").splitlines() if l.strip())
              except Exception as e:
                  return f"(could not read certificate: {e})"

          print("---- certificates the PROFILE allows ----")
          for c in prof.get("DeveloperCertificates", []):
              print(hashlib.sha1(c).hexdigest().upper(), describe(c))
          print("---- certificate(s) imported from your .p12 ----")
          pem_path = f"{tmp}/keychain_certs.pem"
          if os.path.exists(pem_path):
              pem_text = open(pem_path).read()
              for block in re.findall(r"-----BEGIN CERTIFICATE-----.*?-----END CERTIFICATE-----", pem_text, re.S):
                  der = ssl.PEM_cert_to_DER_cert(block)
                  h = hashlib.sha1(der).hexdigest().upper()
                  if h in identities:
                      print(h, describe(der))
          print("-----------------------------------------")

          match = [i for i in identities if i in profile_certs]
          if not match:
              print("::error::The provisioning profile does not include the certificate in your .p12. "
                    "In the Apple Developer portal, edit the profile, tick this exact Apple Development "
                    "certificate and your device, download the profile again, base64 it and update PROVISION_PROFILE_BASE64.")
              sys.exit(1)

          with open(os.environ["GITHUB_ENV"], "a") as env:
              env.write(f"SIGN_IDENTITY={match[0]}\n")
          print("Using signing identity:", match[0])

          # Entitlements the app asks for vs. what the profile allows
          wanted = plistlib.load(open("ios/LLMHub/LLMHub.entitlements", "rb"))
          allowed = prof.get("Entitlements", {})
          for key in wanted:
              if key not in allowed:
                  print(f"::warning::Profile does not allow '{key}'. It will be left out of the signature so the app still installs, "
                        "but the app will not get that capability. Enable it on the App ID, regenerate the profile and update the secret.")
          PY

      - name: Resolve packages
        run: |
          xcodebuild -resolvePackageDependencies \
            -project ios/LLMHub/LLMHub.xcodeproj \
            -scheme LLMHub

      - name: Archive (unsigned)
        run: |
          set -eo pipefail
          mkdir -p build
          # Signing happens in the next step. Passing a provisioning profile on the
          # command line breaks every Swift package target, so the archive is unsigned.
          xcodebuild archive \
            -project ios/LLMHub/LLMHub.xcodeproj \
            -scheme LLMHub \
            -configuration Release \
            -archivePath build/LLMHub.xcarchive \
            -destination "generic/platform=iOS" \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            2>&1 | tee build/archive.log

      - name: Show only the errors from a failed archive
        if: failure()
        run: |
          echo "==== error lines from build/archive.log ===="
          grep -E "error:|ARCHIVE FAILED|fatal error" build/archive.log 2>/dev/null | sort -u | head -40 || true

      - name: Sign app and package IPA
        run: |
          set -eo pipefail
          test -n "$SIGN_IDENTITY"
          APP=$(ls -d build/LLMHub.xcarchive/Products/Applications/*.app | head -n 1)
          echo "App bundle: $APP"

          # Build the entitlements to sign with: the profile's entitlements
          # (these are what Xcode would use), checked against the app's bundle ID.
          python3 - "$APP" <<'PY'
          import os, pathlib, plistlib, sys

          tmp = os.environ["RUNNER_TEMP"]
          app = pathlib.Path(sys.argv[1])
          prof = plistlib.load(open(f"{tmp}/profile.plist", "rb"))
          info = plistlib.load(open(app / "Info.plist", "rb"))
          wanted = plistlib.load(open("ios/LLMHub/LLMHub.entitlements", "rb"))

          bundle = info["CFBundleIdentifier"]
          team = prof["TeamIdentifier"][0]
          ents = dict(prof["Entitlements"])
          appid = ents.get("application-identifier", "")
          prefix = team + "."

          if not appid.startswith(prefix):
              print(f"::error::Unexpected application-identifier in profile: {appid}")
              sys.exit(1)
          pattern = appid[len(prefix):]
          ok = (pattern == "*" or pattern == bundle or
                (pattern.endswith("*") and bundle.startswith(pattern[:-1])))
          if not ok:
              print(f"::error::App bundle ID '{bundle}' does not match the profile's App ID '{appid}'. "
                    "Use a profile created for this exact bundle ID.")
              sys.exit(1)

          # A wildcard profile still needs a concrete application-identifier
          ents["application-identifier"] = prefix + bundle
          if "keychain-access-groups" in ents:
              ents["keychain-access-groups"] = [
                  (prefix + bundle) if g.endswith(".*") else g
                  for g in ents["keychain-access-groups"]
              ]

          for key in wanted:
              status = "included" if key in ents else "NOT in profile, left out"
              print(f"  app entitlement {key}: {status}")

          with open(f"{tmp}/entitlements.plist", "wb") as f:
              plistlib.dump(ents, f, fmt=plistlib.FMT_XML)
          print("Bundle ID:", bundle)
          PY

          cp "$RUNNER_TEMP/profile.mobileprovision" "$APP/embedded.mobileprovision"

          # Sign nested code first (deepest first), then the app itself
          while IFS= read -r -d '' ITEM; do
            echo "Signing $ITEM"
            codesign --force --sign "$SIGN_IDENTITY" --timestamp=none "$ITEM"
          done < <(find "$APP" -depth \( -name "*.framework" -o -name "*.dylib" \) -print0)

          codesign --force --sign "$SIGN_IDENTITY" --timestamp=none \
            --generate-entitlement-der \
            --entitlements "$RUNNER_TEMP/entitlements.plist" "$APP"

          codesign --verify --deep --strict --verbose=2 "$APP"
          echo "---- final entitlements ----"
          codesign -d --entitlements :- "$APP" 2>/dev/null || true

          rm -rf build/Payload
          mkdir -p build/Payload
          ditto "$APP" "build/Payload/$(basename "$APP")"
          (cd build && zip -qry LLMHub.ipa Payload)
          ls -lh build/LLMHub.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: LLMHub-signed-ipa
          path: build/LLMHub.ipa
