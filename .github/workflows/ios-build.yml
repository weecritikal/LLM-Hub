name: Build iOS IPA
on: [workflow_dispatch]

jobs:
  build:
    runs-on: macos-26
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fetch local packages the repo points to
        run: |
          set -eo pipefail
          echo "Folders the repo expects to be separate git repos:"
          git ls-files -s | awk '$1=="160000"{print $2" "$4}' | tee /tmp/gitlinks.txt

          while read -r SHA DIR; do
            NAME=$(basename "$DIR")
            case "$NAME" in
              draw-things-community) URL=https://github.com/drawthingsai/draw-things-community.git ;;
              media-generation-kit)  URL=https://github.com/drawthingsai/media-generation-kit.git ;;
              *) echo "::warning::No known source for $DIR, skipping"; continue ;;
            esac

            echo "Fetching $NAME at $SHA"
            rm -rf "$DIR"
            mkdir -p "$DIR"
            git -C "$DIR" init -q
            git -C "$DIR" remote add origin "$URL"
            if git -C "$DIR" fetch --depth 1 origin "$SHA"; then
              git -C "$DIR" checkout -q FETCH_HEAD
            else
              echo "::warning::Pinned commit not available for $NAME, using latest"
              git -C "$DIR" fetch --depth 1 origin HEAD
              git -C "$DIR" checkout -q FETCH_HEAD
            fi
          done < /tmp/gitlinks.txt

          PKG=ios/LLMHub/LocalPackages/media-generation-kit
          if [ ! -f "$PKG/Package.swift" ]; then
            echo "media-generation-kit still missing, downloading latest public copy"
            rm -rf "$PKG"
            mkdir -p ios/LLMHub/LocalPackages
            git clone --depth 1 https://github.com/drawthingsai/media-generation-kit.git "$PKG"
          fi

          echo "LocalPackages contents:"
          ls -la ios/LLMHub/LocalPackages
          test -f "$PKG/Package.swift"

      - name: Select latest stable Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Install certificate and profile
        env:
          CERT_B64: ${{ secrets.DEV_CERT_P12_BASE64 }}
          CERT_PASS: ${{ secrets.DEV_CERT_PASSWORD }}
          PROFILE_B64: ${{ secrets.PROVISION_PROFILE_BASE64 }}
        run: |
          set -eo pipefail
          KEYCHAIN="$RUNNER_TEMP/build.keychain-db"
          KEYCHAIN_PASS="$(uuidgen)"

          echo "$CERT_B64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          echo "$PROFILE_B64" | base64 --decode > "$RUNNER_TEMP/profile.mobileprovision"

          security create-keychain -p "$KEYCHAIN_PASS" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASS" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -P "$CERT_PASS" \
            -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: \
            -k "$KEYCHAIN_PASS" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" login.keychain-db

          PROFILE_UUID=$(security cms -D -i "$RUNNER_TEMP/profile.mobileprovision" \
            | plutil -extract UUID raw -)
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$RUNNER_TEMP/profile.mobileprovision" \
            "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision"

      - name: Resolve packages
        run: |
          xcodebuild -resolvePackageDependencies \
            -project ios/LLMHub/LLMHub.xcodeproj \
            -scheme LLMHub

      - name: Archive
        env:
          TEAM_ID: ${{ secrets.TEAM_ID }}
          PROFILE_NAME: ${{ secrets.PROFILE_NAME }}
        run: |
          set -eo pipefail
          xcodebuild archive \
            -project ios/LLMHub/LLMHub.xcodeproj \
            -scheme LLMHub \
            -archivePath build/LLMHub.xcarchive \
            -destination "generic/platform=iOS" \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            CODE_SIGN_IDENTITY="Apple Development" \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_NAME"

      - name: Show embedded entitlements
        run: |
          APP=$(ls -d build/LLMHub.xcarchive/Products/Applications/*.app)
          codesign -d --entitlements :- "$APP" || true

      - name: Export IPA
        env:
          TEAM_ID: ${{ secrets.TEAM_ID }}
          PROFILE_NAME: ${{ secrets.PROFILE_NAME }}
        run: |
          set -eo pipefail
          BUNDLE_ID=$(/usr/libexec/PlistBuddy -c "Print :ApplicationProperties:CFBundleIdentifier" \
            build/LLMHub.xcarchive/Info.plist)

          cat > build/ExportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>debugging</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>signingStyle</key><string>manual</string>
            <key>signingCertificate</key><string>Apple Development</string>
            <key>provisioningProfiles</key>
            <dict><key>$BUNDLE_ID</key><string>$PROFILE_NAME</string></dict>
          </dict>
          </plist>
          EOF

          xcodebuild -exportArchive \
            -archivePath build/LLMHub.xcarchive \
            -exportPath build/export \
            -exportOptionsPlist build/ExportOptions.plist

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: LLMHub-signed-ipa
          path: build/export/*.ipa
