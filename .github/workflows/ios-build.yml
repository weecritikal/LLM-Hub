name: Build iOS IPA
on: [workflow_dispatch]

jobs:
  build:
    runs-on: macos-26
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          # For private submodules, uncomment and add a PAT secret:
          # token: ${{ secrets.PAT }}

      - name: Verify local packages exist
        run: |
          PKG=ios/LLMHub/LocalPackages/media-generation-kit
          echo "Contents of ios/LLMHub/LocalPackages:"
          ls -la ios/LLMHub/LocalPackages || true
          if [ ! -f "$PKG/Package.swift" ]; then
            echo "::error::$PKG/Package.swift is missing from the repo. Commit the package or remove the dependency from the Xcode project."
            exit 1
          fi

      - name: Select latest stable Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Resolve packages
        run: |
          xcodebuild -resolvePackageDependencies \
            -project ios/LLMHub/LLMHub.xcodeproj \
            -scheme LLMHub

      - name: Build and package unsigned IPA
        run: |
          set -eo pipefail
          mkdir -p build/Payload

          xcodebuild archive \
            -project ios/LLMHub/LLMHub.xcodeproj \
            -scheme LLMHub \
            -archivePath build/LLMHub.xcarchive \
            -destination "generic/platform=iOS" \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

          cp -R build/LLMHub.xcarchive/Products/Applications/*.app build/Payload/
          cd build
          zip -qr LLMHub.ipa Payload

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: LLMHub-unsigned-ipa
          path: build/LLMHub.ipa
